<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile | TravelMate Pro</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<a class="brand" href="dashboard.html"><b class="brand-mark">T</b><div><strong>TravelMate</strong><span>Plan with purpose</span></div></a>
			<nav aria-label="Primary navigation"><ul class="nav-list"><li><a class="nav-link" href="dashboard.html">⌂ Dashboard</a></li><li><a class="nav-link" href="trips.html">✦ Trips</a></li><li><a class="nav-link" href="expenses.html">₹ Expenses</a></li><li><a class="nav-link" href="checklist.html">✓ Checklist</a></li><li><a class="nav-link" href="reports.html">◒ Reports</a></li><li><a class="nav-link" href="profile.html">○ Profile</a></li></ul></nav>
			<div class="sidebar-footer"><div class="user-mini"><span class="avatar" data-user-initials>T</span><div><strong data-user-name>Traveler</strong><small data-user-email></small></div></div><button class="button button-secondary button-small" data-logout style="margin-top:1rem;width:100%">Log out</button></div>
		</aside>
		<main class="main-content">
			<header class="topbar"><div><button class="menu-button" data-menu-toggle aria-label="Open navigation">☰</button><div class="eyebrow">Your details</div><h1>Profile</h1></div><div class="top-actions"><button class="icon-button" data-theme-toggle aria-label="Toggle dark mode">◐</button></div></header>
			<section class="card" style="max-width:780px">
				<div class="section-heading"><div><h2>Personal profile</h2><p class="muted">Keep your account and travel preferences current.</p></div><span class="avatar" data-user-initials>T</span></div>
				<form id="profile-form" class="form-grid">
					<div class="field"><label for="profile-name">Full name</label><input id="profile-name" name="name" autocomplete="name" required></div>
					<div class="field"><label for="profile-email">Email address</label><input id="profile-email" name="email" type="email" autocomplete="email" required></div>
					<div class="field field-full"><label for="profile-address">Address</label><textarea id="profile-address" name="address" autocomplete="street-address" required></textarea></div>
					<div class="field"><label for="profile-state">State</label><select id="profile-state" name="state" required>
						<option value="">Select your state</option><option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option><option>Andaman and Nicobar Islands</option><option>Chandigarh</option><option>Dadra and Nagar Haveli and Daman and Diu</option><option>Delhi</option><option>Jammu and Kashmir</option><option>Ladakh</option><option>Lakshadweep</option><option>Puducherry</option>
					</select></div>
					<div class="field"><label for="profile-country">Country</label><select id="profile-country" name="country" required>
						<option value="">Select your country</option><option>India</option><option>Australia</option><option>Brazil</option><option>Canada</option><option>China</option><option>France</option><option>Germany</option><option>Italy</option><option>Japan</option><option>Malaysia</option><option>New Zealand</option><option>Singapore</option><option>South Africa</option><option>Spain</option><option>Thailand</option><option>United Arab Emirates</option><option>United Kingdom</option><option>United States</option>
					</select></div>
					<div class="field field-full"><label for="profile-preference">Travel preference</label><select id="profile-preference" name="preference" required>
						<option value="">Select your travel preference</option>
						<option value="Nature & Peace">🌿 Nature &amp; Peace - Mountains, forests, lakes, countryside, relaxation</option>
						<option value="Historical & Heritage">🏛️ Historical &amp; Heritage - Monuments, forts, palaces, ancient sites</option>
						<option value="Art & Culture">🎨 Art &amp; Culture - Museums, cultural events, local traditions</option>
						<option value="Beach & Island">🏖️ Beach &amp; Island - Coastal destinations, water activities</option>
						<option value="Adventure & Trekking">🏔️ Adventure &amp; Trekking - Hiking, camping, rafting, mountain climbing</option>
						<option value="Spiritual & Religious">🛕 Spiritual &amp; Religious - Temples, churches, mosques, pilgrimage sites</option>
						<option value="Food & Culinary">🍴 Food &amp; Culinary - Local cuisine, street food, food tours</option>
						<option value="City Exploration">🏙️ City Exploration - Urban attractions, shopping, nightlife</option>
						<option value="Photography & Scenic Views">📸 Photography &amp; Scenic Views - Landscapes, viewpoints, iconic landmarks</option>
						<option value="Wildlife & Safari">🐾 Wildlife &amp; Safari - National parks, animal reserves</option>
						<option value="Family & Entertainment">🎢 Family &amp; Entertainment - Theme parks, family-friendly attractions</option>
						<option value="Luxury & Relaxation">💎 Luxury &amp; Relaxation - Resorts, spas, premium experiences</option>
						<option value="Shopping & Markets">🛍️ Shopping &amp; Markets - Local bazaars, malls, handicrafts</option>
						<option value="Festivals & Events">🎉 Festivals &amp; Events - Cultural festivals, concerts, celebrations</option>
						<option value="Romantic Getaways">💑 Romantic Getaways - Honeymoon spots, couples experiences</option>
						<option value="Rural & Village Experience">🏕️ Rural &amp; Village Experience - Farm stays, local lifestyle experiences</option>
					</select></div>
					<div class="form-actions field-full"><button class="button button-primary" type="submit">Save profile</button></div>
				</form>
			</section>
		</main>
	</div>
	<script src="../js/app.js"></script><script src="../js/auth.js"></script>
</body>
</html>
