<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | TravelMate Pro</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"></head>
<body class="auth-page">
	<main class="auth-layout">
		<section class="auth-intro"><div class="eyebrow" style="color:#f39c12">TravelMate Pro</div><h1>Go further, calmly.</h1><p>Your trips, budget, and next steps in one considered place.</p></section>
		<section class="auth-card" aria-labelledby="login-title"><div class="eyebrow">Welcome back</div><h2 id="login-title">Sign in</h2><p class="muted">Pick up where you left off.</p><form id="login-form"><div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required></div><div id="login-message" role="alert"></div><button class="button button-primary" type="submit">Sign in</button></form><p class="form-note muted" style="margin-top:1rem">Need an account? <a class="auth-link" href="register.html">Register</a></p></section>
	</main><script src="../js/app.js"></script><script src="../js/auth.js"></script>
</body></html>
