<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | TravelMate Pro</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"></head>
<body class="auth-page">
	<main class="auth-layout">
		<section class="auth-intro"><div class="eyebrow" style="color:#f39c12">TravelMate Pro</div><h1>Plan the feeling, too.</h1><p>Build a travel rhythm that leaves space for discovery and keeps the practical details close.</p></section>
		<section class="auth-card" aria-labelledby="register-title"><div class="eyebrow">Start your next chapter</div><h2 id="register-title">Create your account</h2><p class="muted">Your first itinerary is only a few fields away.</p><form id="register-form"><div class="field"><label for="register-name">Full name</label><input id="register-name" name="name" type="text" autocomplete="name" required></div><div class="field"><label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="register-password">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="register-confirm">Confirm password</label><input id="register-confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required></div><div id="register-message" role="alert"></div><button class="button button-primary" type="submit">Create account</button></form><p class="form-note muted" style="margin-top:1rem">Already registered? <a class="auth-link" href="login.html">Sign in</a></p></section>
	</main><script src="../js/app.js"></script><script src="../js/auth.js"></script>
</body></html>
