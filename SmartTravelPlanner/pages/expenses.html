<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Expenses | TravelMate Pro</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/expenses.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><b class="brand-mark">T</b><div><strong>TravelMate</strong><span>Plan with purpose</span></div></a><nav aria-label="Primary navigation"><ul class="nav-list"><li><a class="nav-link" href="dashboard.html">⌂ Dashboard</a></li><li><a class="nav-link" href="trips.html">✦ Trips</a></li><li><a class="nav-link" href="expenses.html">₹ Expenses</a></li><li><a class="nav-link" href="checklist.html">✓ Checklist</a></li><li><a class="nav-link" href="reports.html">◒ Reports</a></li><li><a class="nav-link" href="profile.html">○ Profile</a></li></ul></nav><div class="sidebar-footer"><div class="user-mini"><span class="avatar" data-user-initials>T</span><div><strong data-user-name>Traveler</strong><small data-user-email></small></div></div><button class="button button-secondary button-small" data-logout style="margin-top:1rem;width:100%">Log out</button></div></aside><main class="main-content"><header class="topbar"><div><button class="menu-button" data-menu-toggle aria-label="Open navigation">☰</button><div class="eyebrow">Keep it clear</div><h1>Expenses</h1></div><div class="top-actions"><button class="icon-button" data-theme-toggle aria-label="Toggle dark mode">◐</button></div></header><section class="grid stats-grid" id="expense-summary"></section><section class="grid content-grid"><article class="card" id="expense-form-card"><div class="section-heading"><div><h2 id="expense-form-title">Add expense</h2><p class="muted">A small record now makes the final report honest.</p></div></div><form class="form-grid" id="expense-editor"><input type="hidden" name="id"><div class="field field-full"><label for="expense-title">Title</label><input id="expense-title" name="title" required></div><div class="field"><label for="expense-amount">Amount (INR)</label><input id="expense-amount" name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="expense-category">Category</label><select id="expense-category" name="category"><option>Accommodation</option><option>Transportation</option><option>Food</option><option>Activities</option><option>Other</option></select></div><div class="field"><label for="expense-date">Date</label><input id="expense-date" name="date" type="date" required></div><div class="field"><label for="expense-trip">Trip</label><select id="expense-trip" name="tripId" required></select></div><div class="form-actions field-full"><button class="button button-secondary" type="reset">Clear</button><button class="button button-primary" type="submit">Save expense</button></div></form></article><article class="card"><div class="section-heading"><h2>Spending by category</h2></div><div id="category-summary"></div></article></section><section class="card" style="margin-top:1rem"><div class="section-heading"><h2>Expense history</h2><select id="expense-filter" style="max-width:180px" aria-label="Filter expenses by trip"><option value="all">All trips</option></select></div><div class="table-wrap"><table><thead><tr><th>Expense</th><th>Category</th><th>Date</th><th>Trip</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="expense-list"></tbody></table></div></section></main></div><script src="../js/app.js"></script><script src="../js/expenses.js"></script></body></html>
