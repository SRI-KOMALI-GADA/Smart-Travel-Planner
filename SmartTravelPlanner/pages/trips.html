<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trips | TravelMate Pro</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/trips.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><b class="brand-mark">T</b><div><strong>TravelMate</strong><span>Plan with purpose</span></div></a><nav aria-label="Primary navigation"><ul class="nav-list"><li><a class="nav-link" href="dashboard.html">⌂ Dashboard</a></li><li><a class="nav-link" href="trips.html">✦ Trips</a></li><li><a class="nav-link" href="expenses.html">₹ Expenses</a></li><li><a class="nav-link" href="checklist.html">✓ Checklist</a></li><li><a class="nav-link" href="reports.html">◒ Reports</a></li><li><a class="nav-link" href="profile.html">○ Profile</a></li></ul></nav><div class="sidebar-footer"><div class="user-mini"><span class="avatar" data-user-initials>T</span><div><strong data-user-name>Traveler</strong><small data-user-email></small></div></div><button class="button button-secondary button-small" data-logout style="margin-top:1rem;width:100%">Log out</button></div></aside><main class="main-content"><header class="topbar"><div><button class="menu-button" data-menu-toggle aria-label="Open navigation">☰</button><div class="eyebrow">Your journeys</div><h1>Trips</h1></div><div class="top-actions"><button class="icon-button" data-theme-toggle aria-label="Toggle dark mode">◐</button><a class="button button-primary" href="#trip-form">+ New trip</a></div></header><section class="card" id="trip-form" style="margin-bottom:1rem"><div class="section-heading"><div><h2 id="trip-form-title">Plan a new trip</h2><p class="muted">Capture the essentials now; refine them later.</p></div></div><form class="form-grid" id="trip-editor"><input type="hidden" name="id"><div class="field field-full"><label for="destination">Destination</label><input id="destination" name="destination" placeholder="e.g. Lisbon, Portugal" required></div><div class="field"><label for="start-date">Start date</label><input id="start-date" name="startDate" type="date" required></div><div class="field"><label for="end-date">End date</label><input id="end-date" name="endDate" type="date" required></div><div class="field"><label for="budget">Budget (INR)</label><input id="budget" name="budget" type="number" min="0" step="0.01" required></div><div class="field"><label for="hotel">Hotel</label><input id="hotel" name="hotel" placeholder="Optional"></div><div class="field"><label for="transportation">Transportation</label><input id="transportation" name="transportation" placeholder="Flight, rail, car..."></div><div class="field field-full"><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="What should you remember?"></textarea></div><div class="form-actions field-full"><button class="button button-secondary" type="reset" id="trip-cancel">Clear</button><button class="button button-primary" type="submit">Save trip</button></div></form></section><section class="card"><div class="search-row"><div><h2>All trips</h2><p class="muted" id="trip-count"></p></div><input id="trip-search" type="search" placeholder="Search destinations" aria-label="Search destinations"></div><div id="trip-list" class="grid"></div></section></main></div><script src="../js/app.js"></script><script src="../js/trips.js"></script></body></html>
